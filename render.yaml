services:
  - type: web
    name: superfbts
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: |
      apt-get update
      apt-get install -y openjdk-17-jdk
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install androguard
    startCommand: |
      python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
